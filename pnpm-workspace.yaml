packages:
  - 'apps/*'
  - 'packages/*'

# Every dependency that ships an install script has to be answered explicitly,
# or `pnpm install` fails. `true` runs the script; `false` skips it knowingly,
# which is the point — an unanswered entry is a native binary nobody decided
# about. This block supersedes `onlyBuiltDependencies`: once it exists, pnpm
# reads it alone, so every builder has to be listed here.
allowBuilds:
  # Nest compiles through SWC, and its native binding is built on install.
  '@swc/core': true
  # drizzle-kit runs on esbuild, which downloads its platform binary here.
  esbuild: true
  # Optional native speed-up for ssh2, used by the Docker client Testcontainers
  # talks to. Skipped: it needs a C++ toolchain and ssh2 works without it.
  cpu-features: false
  # Testcontainers' Docker client. Its build script only compiles the optional
  # native crypto; the pure-JS path is the one we use.
  ssh2: false
  # Generates a CLI shim we never invoke.
  protobufjs: false
